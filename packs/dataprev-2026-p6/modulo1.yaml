# Módulo I — Conhecimentos Gerais (40 questões, peso 1, comum a todos os
# perfis). Não é para aprofundar — é para não ZERAR nenhuma disciplina, o
# que já elimina o candidato independente da nota total (edital 9.17.b).
# Cota mínima, não meta de domínio.
#
# Tratamento desigual por disciplina, de propósito:
#   - Legislação SI/PD: 4 leis públicas, texto oficial buscado e citado por
#     artigo (mesmo padrão da Lei 13.303) — é a parte mais "cardável" com
#     confiança total, e vale o investimento por ser só 5 questões de risco
#     concentrado.
#   - Raciocínio Lógico: conceitos estáveis, cloze funciona bem.
#   - IA (dentro de Atualidades e IA): só a parte de FUNDAMENTOS, que é
#     estável. A parte de "atualidades" (notícias, eventos recentes) NÃO
#     está aqui — vira void rápido num pack versionado. Isso precisa ser
#     estudado perto da prova, com fonte viva (jornal/revista), não aqui.
#   - Português: cloze não ensina compreensão de texto, que é a maior parte
#     da nota (12 questões). Só cobre as regras gramaticais mais cobradas
#     como pegadinha isolada (crase, concordância, colocação pronominal).
#     Não substitui treino de leitura e reescrita de texto.
#   - Inglês: mesmo problema do Português, ainda mais agudo — compreensão de
#     texto em inglês não é card. Cobertura aqui é decorativa, não uma
#     defesa real contra zerar. Se você tem lacuna real em inglês, isso
#     exige prática de leitura, não este pack.

