# O 'id' do tópico É o path. O pai é derivado por split — não existe campo
# 'parent' aqui (1.3).
topics:
  - id: itil
    name: ITIL v4
    weight: 3.0
    order: 1
    # unlocks: [cobit]      # 3.7 — habilite quando cobit.yaml entrar em 'files'

  - id: itil/conceitos
    name: Conceitos-chave e SVS
    weight: 3.0
    order: 1
    unlocks: [itil/praticas]  # 3.7 — mapa do edital

  - id: itil/principios
    name: Princípios Orientadores
    weight: 2.5
    order: 2

  - id: itil/praticas
    name: Práticas de Gerenciamento
    weight: 3.0
    order: 3

# 'source' é obrigatório em todo item (1.5): sem ele você não audita um card
# suspeito seis semanas depois — e você vai encontrar cards suspeitos.
items:

  # --- pool de revisão: cloze, entra no FSRS e no combate diário ------------

  - id: itil-svs-definicao
    topic: itil/conceitos
    kind: cloze
    pool: review
    source: "ITIL 4 Foundation, cap. 4.1"
    front: "ITIL v4 — o que é o Sistema de Valor de Serviço (SVS)?"
    back: >
      Modelo que descreve como todos os componentes e atividades da organização
      trabalham juntos para facilitar a criação de valor. Componentes:
      princípios orientadores, governança, cadeia de valor de serviço, práticas,
      melhoria contínua.

  - id: itil-principios-lista
    topic: itil/principios
    kind: cloze
    pool: review
    source: "ITIL 4 Foundation, cap. 4.3"
    front: "ITIL v4 — os 7 princípios orientadores"
    back: >
      Focar no valor; começar onde você está; progredir iterativamente com
      feedback; colaborar e promover visibilidade; pensar e trabalhar
      holisticamente; manter simples e prático; otimizar e automatizar.

  - id: itil-incidente-objetivo
    topic: itil/praticas
    kind: cloze
    pool: review
    source: "ITIL 4 Foundation, cap. 5.2.5"
    front: "ITIL v4 — objetivo da prática Gerenciamento de Incidentes"
    back: >
      Minimizar o impacto negativo de incidentes restaurando a operação normal
      do serviço o mais rápido possível.
    comment: >
      A FGV gosta de trocar este objetivo pelo de Gerenciamento de Problemas
      (achar causa raiz). Discriminar os dois é o que a questão cobra.

  # --- pool de simulado: questão FGV real, só no boss (2.5) ----------------

  - id: fgv-dataprev-2023-q42
    topic: itil/praticas
    kind: mcq
    pool: exam
    source: "FGV / Dataprev 2023, Analista, Q42"
    stem: >
      (Cole aqui o enunciado literal da questão da prova.)
    choices:
      - "Alternativa A"
      - "Alternativa B"
      - "Alternativa C"
      - "Alternativa D"
      - "Alternativa E"
    answer: 2               # índice 0-based
    comment: >
      Gabarito comentado. Ao importar uma questão de prova, extraia o CONCEITO
      dela como um cloze separado no pool de revisão — a questão original nunca
      entra na rotação de repetição (2.5).
