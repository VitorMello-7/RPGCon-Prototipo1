  - id: pmbok8-existe-atencao
    topic: gestao-governanca/pmbok
    kind: cloze
    pool: review
    source: "Busca geral, 2026-09-01 (fonte secundária — auditar)"
    front: "Cuidado ao estudar PMBOK por conta própria: o que mudou na 8ª edição (2025) e por que isso importa para esta prova?"
    back: >
      A 8ª edição reduziu para 6 princípios e 7 domínios de desempenho
      (Governance, Scope, Schedule, Finance, Stakeholders, Resources, Risk),
      diferentes da 7ª. O edital pede explicitamente PMBOK 7ª edição —
      material novo encontrado buscando "PMBOK" pode já ser da 8ª e confundir.
