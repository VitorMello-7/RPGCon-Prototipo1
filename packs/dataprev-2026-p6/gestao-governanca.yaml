  - id: pmbok7-mudanca-paradigma
    topic: gestao-governanca/pmbok
    kind: cloze
    pool: review
    source: "MPUG — PMBOK7 Principles and Performance Domains (fonte secundária — auditar)"
    front: "PMBOK 7ª edição — qual a mudança de paradigma em relação à 6ª?"
    back: >
      Saiu de uma abordagem baseada em PROCESSOS (5 grupos de processos, 10
      áreas de conhecimento) para uma abordagem baseada em PRINCÍPIOS: 12
      princípios de gerenciamento de projetos e 8 domínios de desempenho
      (performance domains), que substituem as áreas de conhecimento.

